version: '3.9'

services:
  mongodb:
    image: mongo:7
    container_name: dual-dictionary-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: dual-dictionary
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: dual-dictionary-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/dual-dictionary
    depends_on:
      mongodb:
        condition: service_healthy

  admin-api:
    build:
      context: .
      dockerfile: Dockerfile.admin-api
    container_name: dual-dictionary-admin-api
    restart: unless-stopped
    ports:
      - '3001:3001'
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/dual-dictionary
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
